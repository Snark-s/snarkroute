services:
  postgres:
    image: postgres:16-alpine
    container_name: snarkroute-postgres-dev
    environment:
      POSTGRES_DB: snarkroute
      POSTGRES_USER: snarkroute
      POSTGRES_PASSWORD: snarkroute
    ports:
      - "5432:5432"
    volumes:
      - snarkroute-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snarkroute -d snarkroute"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  snarkroute-postgres-dev:
