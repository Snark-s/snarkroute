<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YuE2 Local Studio</title><link id="tabIcon" rel="icon" type="image/png" href="/favicon.png">
<style>
:root{color-scheme:dark;font:15px Inter,system-ui;background:#090b12;color:#eef1fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#24214d 0,transparent 38%),#090b12}main{max-width:1180px;margin:auto;padding:30px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brandLogo{display:block;width:min(330px,58vw);height:auto;filter:drop-shadow(0 10px 24px #d68b2e22)}.brandSub{margin-top:-5px;color:#aab2c9;letter-spacing:.08em;text-transform:uppercase;font-size:11px}.pill{padding:8px 14px;border:1px solid #59452b;border-radius:999px;background:#17130e;color:#e9bd69}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.card{background:#10131ddd;border:1px solid #292f42;border-radius:20px;padding:20px;box-shadow:0 18px 45px #0005}label{display:block;margin:12px 0 6px;color:#b9c1d8}textarea,input,select{width:100%;border:1px solid #343b52;background:#0b0e16;color:#fff;border-radius:10px;padding:11px}textarea{resize:vertical;min-height:100px}.lyrics{min-height:230px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#a66a24;color:white}button.alt{background:#242a3a}button.danger{background:#743b49}button:disabled{opacity:.45;cursor:default}.stage{font-size:22px;margin:8px 0}.muted{color:#8e98b1}.log{height:220px;overflow:auto;background:#090b12;border-radius:12px;padding:10px;font:12px ui-monospace,monospace}.entry{border-top:1px solid #292f42;padding:13px 0}.entry:first-child{border:0}audio{width:100%;margin:8px 0}.abc{min-height:220px;font-family:ui-monospace,monospace}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}main{padding:16px}}
</style></head><body><main>
<div class="head"><div><img class="brandLogo" src="/yue2-logo.png" alt="YuE2"><div class="brandSub">Local music studio · 48 kHz stereo</div></div><div id="health" class="pill">Loading…</div></div>
<div class="grid"><section class="card"><label>Style / prompt</label><textarea id="style">cinematic indie pop, warm female vocal, piano, strings, 92 bpm</textarea><label>Lyrics</label><textarea id="lyrics" class="lyrics">[Verse]
A quiet light across the room
A melody begins to bloom

[Chorus]
Carry the sound into the sky</textarea>
<div class="row"><div><label>Seed</label><input id="seed" type="number" value="831001" min="0"></div><div><label>Planning</label><select id="cot"><option value="full">Full: melody + chords</option><option value="melody">Melody only</option><option value="off">Off</option></select></div><div><label>CFG scale</label><input id="cfg" type="number" step=".01" placeholder="YuE2 default"></div></div>
<details><summary style="margin-top:16px;cursor:pointer">Advanced generation parameters</summary><div class="row"><div><label>ODE steps</label><input id="ode" type="number" value="32" min="1" max="100"></div><div><label>Semantic temperature</label><input id="temperature" type="number" value="1" step=".05"></div><div><label>Semantic top-p</label><input id="topP" type="number" value=".95" step=".01"></div></div></details>
<div class="actions"><button id="generate">Generate</button><button id="cancel" class="danger" disabled>Stop generation</button><button id="folder" class="alt">Open outputs</button></div></section>
<aside class="card"><div class="muted">Current stage</div><div id="stage" class="stage">loading</div><div id="current" class="muted">Preparing pipeline…</div><h3>Progress log</h3><div id="log" class="log"></div></aside></div>
<section class="card" style="margin-top:18px"><h2>Result and session history</h2><div id="history" class="muted">No generations in this session.</div></section>
</main><script>
const $=id=>document.getElementById(id);let lastHistory='',iconTimer=null,iconAngle=0,tabStage='';const iconImage=new Image();iconImage.src='/favicon.png';
async function request(path,options){const r=await fetch(path,options);const data=await r.json();if(!r.ok)throw new Error(data.detail||data.error||r.statusText);return data}
function payload(abc){const cfg=$('cfg').value;return{style:$('style').value,lyrics:$('lyrics').value,seed:Number($('seed').value),cot:$('cot').value,cfg_scale:cfg===''?null:Number(cfg),abc:abc||null,name:'webui',ode_steps:Number($('ode').value),semantic_sampling:{temperature:Number($('temperature').value),top_p:Number($('topP').value)}}}
async function generate(abc){try{await request('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload(abc))})}catch(e){alert(e.message)}}
$('generate').onclick=()=>generate(null);$('cancel').onclick=()=>request('/stop-generation',{method:'POST'}).catch(e=>alert(e.message));$('folder').onclick=()=>request('/open-output-folder',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).catch(e=>alert(e.message));
function renderHistory(items){const key=JSON.stringify(items);if(key===lastHistory)return;lastHistory=key;$('history').innerHTML=items.length?items.map(x=>`<article class="entry"><b>${x.id}</b> · ${x.duration?.toFixed(1)||'?'}s · seed ${x.seed}<br><span class="muted">${x.output}</span><audio controls src="${x.audio_url}"></audio>${x.abc?`<label>ABC score (editable)</label><textarea class="abc">${escapeHtml(x.abc)}</textarea><div class="actions"><button class="rerender">Render edited ABC</button><button class="alt openfolder">Open folder</button></div>`:`<button class="alt openfolder">Open folder</button>`}</article>`).join(''):'No generations in this session.';document.querySelectorAll('.entry').forEach((el,i)=>{const x=items[i];el.querySelector('.rerender')?.addEventListener('click',()=>generate(el.querySelector('.abc').value));el.querySelector('.openfolder')?.addEventListener('click',()=>request('/open-output-folder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:x.id})}))})}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function updateTab(active,stage){tabStage=stage;document.title=active?`● YuE2 — ${stage}`:'YuE2 Local Studio';if(active&&!iconTimer){const canvas=document.createElement('canvas');canvas.width=canvas.height=64;const ctx=canvas.getContext('2d');iconTimer=setInterval(()=>{ctx.clearRect(0,0,64,64);ctx.drawImage(iconImage,7,7,50,50);ctx.lineWidth=5;ctx.strokeStyle='#ffd477';ctx.shadowBlur=8;ctx.shadowColor='#ff9f2d';ctx.beginPath();ctx.arc(32,32,28,iconAngle,iconAngle+Math.PI*1.35);ctx.stroke();ctx.shadowBlur=0;iconAngle+=.28;$('tabIcon').href=canvas.toDataURL('image/png')},120)}else if(!active&&iconTimer){clearInterval(iconTimer);iconTimer=null;$('tabIcon').href='/favicon.png'}}
async function poll(){try{const s=await request('/status');const tokens=s.current?.tokens?` · ${Object.values(s.current.tokens).reduce((a,b)=>a+b,0)} tokens`:'';$('health').textContent=s.status+(s.model_loaded?' · model ready':'');$('stage').textContent=s.stage;$('current').textContent=s.error||(s.current?.output||'Ready for a request')+tokens;$('generate').disabled=s.generating||!s.model_loaded;$('cancel').disabled=!s.generating;$('log').innerHTML=s.log.map(x=>`<div>${x.at.slice(11,19)} [${x.stage}] ${escapeHtml(x.message)}</div>`).join('');$('log').scrollTop=$('log').scrollHeight;renderHistory(s.history);updateTab(s.generating||s.status==='loading',s.stage)}catch(e){$('health').textContent='offline';$('current').textContent=e.message;updateTab(false,'offline')}setTimeout(poll,1000)}poll();
</script></body></html>
