[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "snarkroute-local-upscale-worker"
version = "0.1.0"
description = "Authenticated local image upscale worker for SnarkRoute"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "imageio-ffmpeg==0.6.0",
  "numpy==2.2.6",
  "pillow==11.3.0",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
gpu = [
  "onnxruntime-gpu==1.22.0",
  "spandrel==0.4.1",
  "torch==2.7.1",
  "torchvision==0.22.1",
]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "gpu" }]
torchvision = [{ index = "pytorch-cu128", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
