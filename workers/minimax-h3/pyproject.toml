[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "snarkroute-minimax-h3-worker"
version = "0.2.0"
description = "Backend-neutral, authenticated MiniMax H3 worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.40.14",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "huggingface-hub==0.34.4",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
