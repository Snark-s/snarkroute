routeVersion: "0.1"
route:
  id: video-debug
  title: Video Debug
  description: Inspect a local video file and write its metadata.
  author:
    name: SnarkRoute
  tags:
    - local
    - video
economics:
  enabled: false
nodes:
  - id: video_asset
    type: input.video
    title: Video Asset
    params:
      path: C:\path\to\video.mp4
  - id: debug
    type: debug.log
    title: Debug
    params:
      value: "{{video_asset.output.filename}}"
  - id: output
    type: output.file
    title: Output
    params:
      filename: video-metadata.json
edges:
  - from: video_asset
    to: debug
  - from: video_asset
    to: output
  - from: debug
    to: output
provenance:
  tool: snarkroute
  events: []
